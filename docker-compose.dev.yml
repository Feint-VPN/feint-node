services:
  vpn-node-api:
    build:
      context: ./node
      dockerfile: Dockerfile
    container_name: vpn-node-api-dev
    user: root          # dev only — gives write access to the volume
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sing-box-data:/opt/sing-box
      - relay-data:/opt/relay
    env_file:
      - .env.local
    environment:
      - DEV_MODE=true
      - API_PORT=8000
      - API_SECRET=${API_SECRET:?API_SECRET must be set for the local dev node}
      - CONFIG_PATH=/opt/sing-box/config.json
      - BACKUP_DIR=/opt/sing-box/backups
      - SINGBOX_CONTAINER_NAME=sing-box
      - RATHOLE_CONFIG_PATH=/opt/relay/rathole.toml
      - RATHOLE_STATE_PATH=/opt/relay/state.json
      - RATHOLE_CONTAINER_NAME=feint-rathole-dev

  rathole:
    build:
      context: ./rathole
      dockerfile: Dockerfile
    container_name: feint-rathole-dev
    user: root
    network_mode: host
    volumes:
      - relay-data:/opt/relay
    environment:
      - RATHOLE_CONFIG_PATH=/opt/relay/rathole.toml
    restart: unless-stopped

volumes:
  sing-box-data:
    driver: local
  relay-data:
    driver: local
