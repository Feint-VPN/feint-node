[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "feint-node"
version = "2.0.0"
description = "Feint VPN node API"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0",
    "docker>=7.0",
    "email-validator>=2.1",
    "fastapi>=0.109",
    "grpcio>=1.64",
    "protobuf>=5.27",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.1,<3.0",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.98",
    "httpx>=0.26",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.12",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["ASYNC", "B", "BLE", "DTZ", "E4", "E7", "E9", "F", "G", "I", "RUF", "SIM", "UP"]
ignore = ["B008"]  # FastAPI dependency declarations intentionally call Depends.

[tool.ruff.lint.per-file-ignores]
"node/src/adapters/node_telemetry.py" = ["BLE001"]
"node/src/domain/user_service.py" = ["BLE001"]
"node/src/adapters/traffic_tracker.py" = ["ASYNC240"]
"node/tests/**" = ["SIM117"]

[tool.pytest.ini_options]
testpaths = ["node/tests"]
pythonpath = ["node/src"]
asyncio_mode = "auto"
addopts = "--strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "property: Property-based tests",
    "slow: Slow running tests",
]
