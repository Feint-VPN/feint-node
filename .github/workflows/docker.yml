name: Docker image

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  NODE_IMAGE: ghcr.io/feint-vpn/feint-node
  SINGBOX_IMAGE: ghcr.io/feint-vpn/feint-sing-box

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: node-metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.NODE_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ./node
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.node-metadata.outputs.tags }}
          labels: ${{ steps.node-metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate sing-box image metadata
        id: singbox-metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.SINGBOX_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=v1.13.12-feint.1
            type=sha,prefix=sha-

      - name: Build and publish sing-box
        uses: docker/build-push-action@v6
        with:
          context: ./sing-box
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.singbox-metadata.outputs.tags }}
          labels: ${{ steps.singbox-metadata.outputs.labels }}
          cache-from: type=gha,scope=sing-box
          cache-to: type=gha,mode=max,scope=sing-box
