services:
  vpn-node-api:
    image: ${NODE_IMAGE:-ghcr.io/feint-vpn/feint-node:latest}
    container_name: vpn-node-api
    ports:
      - "${API_PORT:-8337}:${API_PORT:-8337}"
    volumes:
      - sing-box-data:/opt/sing-box
      - relay-data:/opt/relay
      - /var/run/docker.sock:/var/run/docker.sock
      - certbot-certs:/etc/letsencrypt:ro
      - ./.env.local:/opt/vpn-node/.env.local
    env_file:
      - .env.local
    environment:
      - CONFIG_PATH=/opt/sing-box/config.json
      - BACKUP_DIR=/opt/sing-box/backups
      - DOCKER_SOCKET=/var/run/docker.sock
      - SINGBOX_CONTAINER_NAME=${VPN_RUNTIME_CONTAINER_NAME:-sing-box}
      - VPN_RUNTIME=${VPN_RUNTIME:-sing-box}
      - VPN_RUNTIME_CONTAINER_NAME=${VPN_RUNTIME_CONTAINER_NAME:-sing-box}
      - XRAY_CONFIG_PATH=${XRAY_CONFIG_PATH:-/opt/sing-box/xray.json}
      - CLASH_API_URL=${CLASH_API_URL:-http://host.docker.internal:9090}
      - V2RAY_API_ADDRESS=${V2RAY_API_ADDRESS:-host.docker.internal:10085}
      - TRAFFIC_STATE_PATH=/opt/sing-box/traffic.json
      - RATHOLE_CONFIG_PATH=/opt/relay/rathole.toml
      - RATHOLE_STATE_PATH=/opt/relay/state.json
      - RATHOLE_CONTAINER_NAME=${RATHOLE_CONTAINER_NAME:-feint-rathole}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    group_add:
      - "${DOCKER_GID:-987}"
    restart: unless-stopped
    depends_on:
      - sing-box
      - rathole
    networks:
      - vpn-network

  sing-box:
    image: ${VPN_RUNTIME_IMAGE:-ghcr.io/feint-vpn/feint-sing-box:v1.13.19-feint.2}
    container_name: ${VPN_RUNTIME_CONTAINER_NAME:-sing-box}
    user: "1000:1000"
    network_mode: host
    env_file:
      - .env.local
    volumes:
      - sing-box-data:/opt/sing-box
      - certbot-certs:/etc/letsencrypt:ro
    command: ${VPN_RUNTIME_COMMAND:-run -c /opt/sing-box/config.json}
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    network_mode: host
    env_file:
      - .env.local
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;"
    restart: unless-stopped

  rathole:
    image: ${RATHOLE_IMAGE:-ghcr.io/feint-vpn/feint-rathole:v0.5.0-feint.1}
    container_name: ${RATHOLE_CONTAINER_NAME:-feint-rathole}
    user: "1000:1000"
    network_mode: host
    env_file:
      - .env.local
    volumes:
      - relay-data:/opt/relay
    restart: unless-stopped

volumes:
  sing-box-data:
    driver: local
  certbot-certs:
    driver: local
  certbot-www:
    driver: local
  relay-data:
    driver: local

networks:
  vpn-network:
    driver: bridge
